name: Publish KiCad automation repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Test with KiCad ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 10.0.0
            image: 10.0.0-amd64
          - version: 10.0.8
            image: 10.0.8-amd64
    container:
      image: ghcr.io/kicad/kicad:${{ matrix.image }}
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Run KiCad integration tests
        env:
          KICAD_USE_SYSTEM: "1"
        run: |
          set +e
          scripts/test_kicad.sh > /tmp/kicad-integration.log 2>&1
          status=$?
          set -e
          cat /tmp/kicad-integration.log
          if [ "$status" -ne 0 ]; then
            python3 -c "from pathlib import Path; lines = Path('/tmp/kicad-integration.log').read_text(); tail = '\n'.join(lines.splitlines()[-100:])[-12000:]; escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'); print(f'::error title=KiCad integration failure::{escaped}')"
          fi
          exit "$status"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build PCM repository
        env:
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repo_name=${REPOSITORY#*/}
          python scripts/build_pcm.py \
            --base-url "https://${OWNER}.github.io/${repo_name}/kicad" \
            --output-dir site/kicad
          python scripts/test_pcm.py site/kicad
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
